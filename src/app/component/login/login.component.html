<div class="login-wrap">
  <div class="login-card">
    <img src="assets/brand/learnlink-logo.png" alt="LearnLink" class="login-logo" />
    <h1 class="sr-only">LearnLink</h1>
    <p>
      Practice chat and video calls. Open a <strong>second tab</strong> (or Incognito),
      sign in as a <strong>different</strong> user, then message or call.
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label>
        Username
        <input
          type="text"
          formControlName="username"
          [class.invalid]="submitted && loginForm.get('username')?.errors"
        />
      </label>
      <div class="error" *ngIf="submitted && loginForm.get('username')?.errors">Username is required</div>

      <label>
        Password
        <input
          type="password"
          formControlName="password"
          [class.invalid]="submitted && loginForm.get('password')?.errors"
        />
      </label>
      <div class="error" *ngIf="submitted && loginForm.get('password')?.errors">Password is required</div>

      <button type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
        Login
      </button>
    </form>

    <div class="demo">
      <span>Quick users (password <code>123456</code>)</span>
      <div class="chips">
        <button type="button" *ngFor="let name of demoUsers" (click)="fillDemo(name)">{{ name }}</button>
      </div>
    </div>
  </div>
</div>
