<div class="call-container">
  <div class="call-banner">
    <strong>{{ remoteName }}</strong>
    <span class="provider-pill">{{ providerName }}</span>
  </div>

  <div class="status" *ngIf="isLoading">Connecting…</div>
  <div class="status error" *ngIf="errorMessage">{{ errorMessage }}</div>

  <video
    #remoteVideo
    class="remote-video"
    [class.off]="!usesRemoteVideo"
    autoplay
    playsinline
  ></video>
  <div #providerHost class="remote-video provider-host" [class.off]="usesRemoteVideo"></div>
  <video #localVideo class="local-video" autoplay playsinline muted></video>

  <div class="controls">
    <button type="button" (click)="toggleMic()" class="control-btn">
      {{ media.microphonePrivacy ? 'Unmute' : 'Mute' }}
    </button>
    <button type="button" (click)="toggleCamera()" class="control-btn">
      {{ media.cameraPrivacy ? 'Camera on' : 'Camera off' }}
    </button>
    <button
      *ngIf="canShare"
      type="button"
      (click)="toggleShare()"
      class="control-btn"
      [class.active]="media.sharingScreen"
    >
      {{ media.sharingScreen ? 'Stop share' : 'Share screen' }}
    </button>
    <button
      *ngIf="canRecord"
      type="button"
      (click)="toggleRecord()"
      class="control-btn"
      [class.active]="media.recording"
    >
      {{ media.recording ? 'Stop rec' : 'Record' }}
    </button>
    <button type="button" (click)="endCall()" class="end-btn">End call</button>
  </div>
</div>
