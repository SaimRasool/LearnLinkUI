<nav class="app-nav" *ngIf="user && !hideChrome">
  <a class="brand" routerLink="/messenger">
    <img src="assets/brand/learnlink-icon.png" alt="" class="brand-mark" />
    <span>LearnLink</span>
  </a>
  <div class="nav-links">
    <a routerLink="/messenger" routerLinkActive="active">Messenger</a>
    <a routerLink="/settings" routerLinkActive="active">Settings</a>
    <button type="button" class="link-btn" (click)="logout()">Logout</button>
  </div>
  <div class="nav-meta">
    <button
      type="button"
      class="pill"
      [class.online]="connectionState === 'open'"
      [class.pending]="connectionState === 'connecting'"
      [title]="signaling.lastError || (connectionState === 'open' ? signalingLabel : 'Click to reconnect')"
      (click)="reconnectSignaling()"
    >
      {{ connectionState === 'open' ? signalingLabel : connectionState }}
    </button>
    <span class="pill muted">{{ videoLabel }}</span>
    <img *ngIf="user.image" [src]="user.image" [alt]="user.userName" class="nav-avatar" />
    <span class="welcome">{{ user.userName }}</span>
  </div>
</nav>

<div class="app-container" [class.call-mode]="hideChrome">
  <alert></alert>
  <router-outlet></router-outlet>
</div>

<div class="incoming-call-overlay" *ngIf="callerUserId">
  <div class="incoming-call-card">
    <img *ngIf="callerImage" [src]="callerImage" [alt]="callerName" class="caller-avatar" />
    <h3>Incoming call</h3>
    <p>From <strong>{{ callerName }}</strong></p>
    <div class="actions">
      <button class="btn-decline" type="button" (click)="declineCall()">Decline</button>
      <button class="btn-accept" type="button" (click)="acceptCall()">Accept</button>
    </div>
  </div>
</div>
